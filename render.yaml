services:
  # Python FastAPI Web Service + Pathway Telemetry Engine
  - type: web
    name: urban-intelligence-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python src/main.py --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AUTH_DB_PATH
        value: ./auth_store.db
      - key: PATHWAY_MODE
        value: hybrid

  # React + TypeScript + Vite SPA Frontend
  - type: web
    name: urban-intelligence-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

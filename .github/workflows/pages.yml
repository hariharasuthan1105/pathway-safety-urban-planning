name: Publish voxel frontend to GitHub Pages

# Publication starts only after an approved merge to main or manual dispatch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VITE_DEPLOY_TARGET: github-pages
      VITE_BASE_PATH: /pathway-safety-urban-planning/
      VITE_ROUTER_MODE: hash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate backend repository variable
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: node frontend/scripts/verify-backend.mjs --validate-only
      - name: Verify configured backend is healthy
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: node frontend/scripts/verify-backend.mjs
      - name: Build the active React application
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_DEPLOY_TARGET: github-pages
          VITE_BASE_PATH: /pathway-safety-urban-planning/
          VITE_ROUTER_MODE: hash
        run: npm ci && npm run build
      - name: Assert production artifact
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: node frontend/scripts/verify-artifact.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Publish compiled frontend
        id: deployment
        uses: actions/deploy-pages@v5
